[package]
name = "codo"
version = "0.0.1"
description = "codo — local production-event log for CI charcoal manufacturing"
authors = ["Renzo Sy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "codo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri shell — pinned ≥ 2.6 per PROJECT_BRAIN.md §5 #10.
tauri = { version = "2.6", features = [] }

# In-app auto-updater (PROJECT_BRAIN.md §3 build/packaging row). Self-signed
# via the Tauri signer keypair embedded as `plugins.updater.pubkey` in
# tauri.conf.json — Apple Developer ID / notarization is a SEPARATE,
# optional concern (Gatekeeper warnings on first install only).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# libSQL — local embedded replica that auto-syncs to Turso cloud.
# `replication` enables embedded-replica builders; `remote` enables direct-remote
# connections used by the migration runner per PROJECT_BRAIN.md §5 #1.
# `tls` is REQUIRED for remote/replica connections to libsql:// URLs — without
# it, Builder::new_remote(...).build() panics inside a tokio worker with
# 'must provide your own http connector', and the panic doesn't propagate to
# the Tauri command (UI just hangs at "applying migrations…").
#
# Bumped from 0.6 → 0.9: Turso's server now rejects 0.6's sync protocol with
# 'deprecated version of sync, please upgrade your client'. 0.9.x supports
# the current sync protocol — this is the upgrade path the brain anticipated
# in §3 'embedded replicas marked as legacy'.
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "replication", "tls"] }

# OS keyring (macOS Keychain / Windows Credential Manager / Linux Secret Service).
# Per PROJECT_BRAIN.md §3 we may use stronghold OR keyring; the keyring crate is
# simpler (no master-password vault setup) and a perfect fit for a single-user app.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Async / serde / errors
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Date handling for ISO recv_date / prod_date.
chrono = { version = "0.4", features = ["serde"] }

# Turso Platform API HTTP calls (gotcha #12 onboarding).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# NOTE: tauri-specta 2.0.0-rc.24 is the brain's intended type bridge.
# Pinning it requires a specific specta companion version that drifts every
# couple of weeks at the RC stage — punting until Step 3 (the first vertical
# slice with real commands worth typing). For now, hand-written TS interfaces
# live in src/lib/types/codo.ts (Plan B from PROJECT_BRAIN.md §3 / §5 #9).

[features]
default = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
